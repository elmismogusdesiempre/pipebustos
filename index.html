<!DOCTYPE html>
<html lang="es" data-theme="clasico" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Test diagnóstico</title>
<style>
  /* ============================================================
     TAMAÑOS DE LETRA
     ============================================================ */
  html[data-size="s"]  { --fs-base:15px; --fs-q:21px; --fs-opt:15px; --fs-emo:20px; }
  html[data-size="m"]  { --fs-base:16px; --fs-q:25px; --fs-opt:16px; --fs-emo:24px; }
  html[data-size="l"]  { --fs-base:17px; --fs-q:28px; --fs-opt:17px; --fs-emo:27px; }
  html[data-size="xl"] { --fs-base:19px; --fs-q:32px; --fs-opt:19px; --fs-emo:31px; }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  /* ============================================================
     PALETAS
     ============================================================ */

  :root{
    --radius:0px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --bg:#FBFAF7;
    --surface:#FFFFFF;
    --ink:#16150F;
    --soft:#6E6C63;
    --faint:#A8A69C;
    --line:#E6E4DC;
    --line2:#EFEEE8;
    --sel:#F1F0E9;
    --accent:#16150F;
    --accent-soft:#E4E1D6;

    --ok:#2F6B45;
    --ok-bg:#E8F1EA;
    --mid:#B07D1A;
    --low:#C2622E;
    --low-bg:#F8EAE4;

    --o1-bg:#FAF3E8;  --o1-bd:#E8D8BC;
    --o2-bg:#EAF1F8;  --o2-bd:#C9DCEB;
    --o3-bg:#EDF4EA;  --o3-bd:#CFE2C6;
    --o4-bg:#F8ECEE;  --o4-bd:#EBCBD0;

    --track-tex:none;
    --shadow:0 14px 34px rgba(0,0,0,.07);
  }

  :root[data-theme="futbol"]{
    --bg:#F0F7EF;
    --surface:#FFFFFF;
    --ink:#0F2A1B;
    --soft:#4C6B58;
    --faint:#8FA898;
    --line:#D5E7D7;
    --line2:#E6F0E7;
    --sel:#DDF1DF;
    --accent:#1E8A4C;
    --accent-soft:#B9E3C4;

    --ok:#1E8A4C;
    --ok-bg:#DDF1DF;
    --mid:#C99A16;
    --low:#D4703A;
    --low-bg:#F8E2D6;

    --o1-bg:#E1F2E4;  --o1-bd:#A9DBB6;
    --o2-bg:#FCF3D6;  --o2-bd:#F0DC8C;
    --o3-bg:#E1EEF7;  --o3-bd:#B3D3E8;
    --o4-bg:#F8EEE2;  --o4-bd:#E8CFA8;

    --track-tex:repeating-linear-gradient(90deg,
      rgba(30,138,76,.10) 0 12px, rgba(30,138,76,.20) 12px 24px);
  }

  :root[data-theme="kawaii"]{
    --radius:20px;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", ui-sans-serif, system-ui, sans-serif;
    --bg:#FFF5F9;
    --surface:#FFFFFF;
    --ink:#4A2E3D;
    --soft:#8A6A7A;
    --faint:#C9AABA;
    --line:#F7DEE8;
    --line2:#FCEBF2;
    --sel:#FDE7F0;
    --accent:#F06A9B;
    --accent-soft:#FBD1E0;

    --ok:#5BB98C;
    --ok-bg:#E4F5EC;
    --mid:#E8A33D;
    --low:#F08A8A;
    --low-bg:#FBE3E3;

    --o1-bg:#FFE4EF;  --o1-bd:#F9B8CF;
    --o2-bg:#EAE0F7;  --o2-bd:#CCB8E8;
    --o3-bg:#DFF5E9;  --o3-bd:#A8DFC2;
    --o4-bg:#FFF3D6;  --o4-bd:#F0DCA0;

    --shadow:0 16px 34px rgba(240,106,155,.14);
  }

  :root[data-theme="arcade"]{
    --bg:#12121B;
    --surface:#1A1A26;
    --ink:#EFEDF7;
    --soft:#A09DB5;
    --faint:#6E6B85;
    --line:#2A2A3A;
    --line2:#21212E;
    --sel:#2A2740;
    --accent:#8B7CFF;
    --accent-soft:#3A3560;

    --ok:#3DDC97;
    --ok-bg:#173328;
    --mid:#FFC857;
    --low:#FF7A8A;
    --low-bg:#321C25;

    --o1-bg:#241E3C;  --o1-bd:#4B4080;
    --o2-bg:#1A2E3A;  --o2-bd:#2F5568;
    --o3-bg:#1B3227;  --o3-bd:#2E5E48;
    --o4-bg:#321E2C;  --o4-bd:#6A3A56;

    --shadow:0 16px 40px rgba(0,0,0,.5);
  }

  /* ============================================================
     BASE
     ============================================================ */

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-size:var(--fs-base);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease, color .25s ease;
  }

  .wrap{
    max-width:780px;
    margin:0 auto;
    padding:72px 28px 120px;
  }
  @media (max-width:600px){
    .wrap{ padding:44px 18px 80px; }
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 14px;
    font-weight:700;
  }
  h1{
    font-size:32px;
    font-weight:700;
    letter-spacing:-.025em;
    line-height:1.15;
    margin:0 0 14px;
  }
  .lead{
    font-size:15px;
    color:var(--soft);
    margin:0 0 42px;
    max-width:58ch;
  }
  .lead em{ font-style:italic; color:var(--ink); }

  /* ============================================================
     AJUSTES
     ============================================================ */

  .gear{
    position:fixed;
    top:18px; right:18px;
    z-index:60;
    width:42px; height:42px;
    display:grid;
    place-items:center;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--soft);
    cursor:pointer;
    padding:0;
    transition:color .15s ease, border-color .15s ease, background .25s ease;
  }
  .gear:hover{ color:var(--accent); border-color:var(--accent); }
  .gear.on{ color:var(--accent); border-color:var(--accent); background:var(--sel); }

  .panel{
    position:fixed;
    top:70px; right:18px;
    z-index:60;
    width:268px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 14px 14px;
    box-shadow:var(--shadow);
    animation:pop .18s ease both;
    transition:background .25s ease, border-color .25s ease;
  }
  .panel[hidden]{ display:none; }

  @keyframes pop{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:none; }
  }

  .panel-title{
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--faint);
    margin:0 0 8px 8px;
    font-weight:700;
  }
  .sizes + .panel-title,
  #swatches + .panel-title{ margin-top:16px; }

  .swatch{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    text-align:left;
    background:none;
    border:0;
    border-radius:var(--radius);
    padding:9px 8px;
    font:inherit;
    color:inherit;
    cursor:pointer;
    transition:background .12s ease;
  }
  .swatch:hover{ background:var(--sel); }
  .swatch.active{ background:var(--sel); }

  .swatch .dots{ display:flex; gap:3px; flex:none; }
  .swatch .dots i{
    display:block;
    width:11px; height:11px;
    border-radius:2px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .swatch .sw-text b{
    display:block;
    font-size:13px;
    font-weight:700;
    line-height:1.35;
  }
  .swatch .sw-text small{
    display:block;
    font-size:11px;
    color:var(--faint);
    line-height:1.35;
  }

  .sizes{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:6px;
    padding:0 8px;
  }
  .sizes button{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:9px 0;
    font:inherit;
    font-weight:700;
    color:var(--soft);
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
    line-height:1;
  }
  .sizes button:nth-child(1){ font-size:12px; }
  .sizes button:nth-child(2){ font-size:15px; }
  .sizes button:nth-child(3){ font-size:18px; }
  .sizes button:nth-child(4){ font-size:21px; }
  .sizes button:hover{ border-color:var(--faint); }
  .sizes button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  :root[data-theme="arcade"] .sizes button.active{ color:#12121B; }

  /* ============================================================
     MENÚ INICIAL
     ============================================================ */

  .menu{ border-top:1px solid var(--line); }

  .btn{
    display:flex;
    flex-direction:column;
    gap:2px;
    width:100%;
    text-align:left;
    background:none;
    border:0;
    border-bottom:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 6px;
    font:inherit;
    color:inherit;
    cursor:pointer;
    transition:background .14s ease, padding-left .14s ease;
    position:relative;
  }
  .btn::before{
    content:"";
    position:absolute;
    left:0; top:14px; bottom:14px;
    width:3px;
    background:var(--accent);
    transform:scaleY(0);
    transform-origin:center;
    transition:transform .18s ease;
  }
  .btn:hover{ background:var(--sel); padding-left:16px; }
  .btn:hover::before{ transform:scaleY(1); }
  .btn .t{ font-weight:700; font-size:16px; }
  .btn .s{ font-size:13px; color:var(--faint); }

  .foot{
    font-size:12px;
    color:var(--faint);
    margin:32px 0 0;
  }

  /* ============================================================
     PREGUNTA
     ============================================================ */

  .meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--faint);
    margin-bottom:12px;
    font-weight:700;
  }
  .meta .pill{
    background:var(--accent-soft);
    border-radius:var(--radius);
    padding:4px 10px;
    color:var(--ink);
    letter-spacing:.1em;
    font-weight:700;
  }

  .bar{
    height:4px;
    background:var(--line2);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .bar i{
    display:block;
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--ok));
    transition:width .35s cubic-bezier(.3,.9,.3,1);
  }

  .q{
    font-size:var(--fs-q);
    line-height:1.4;
    font-weight:700;
    letter-spacing:-.015em;
    margin:48px 0 32px;
    animation:fadeUp .32s ease both;
  }
  @media (max-width:600px){
    .q{ margin:32px 0 22px; }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(9px); }
    to{ opacity:1; transform:none; }
  }

  .opts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    animation:fadeUp .32s ease both;
    animation-delay:.05s;
  }
  @media (max-width:560px){
    .opts{ grid-template-columns:1fr; gap:9px; }
  }

  .opt{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    min-height:76px;
    text-align:left;
    font:inherit;
    color:inherit;
    padding:16px 18px;
    border:2px solid transparent;
    border-radius:var(--radius);
    cursor:pointer;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .opt:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,.07);
  }

  .opt[data-k="0"]{ background:var(--o1-bg); border-color:var(--o1-bd); }
  .opt[data-k="1"]{ background:var(--o2-bg); border-color:var(--o2-bd); }
  .opt[data-k="2"]{ background:var(--o3-bg); border-color:var(--o3-bd); }
  .opt[data-k="3"]{ background:var(--o4-bg); border-color:var(--o4-bd); }

  .opt .emoji{
    flex:none;
    font-size:var(--fs-emo);
    line-height:1;
    display:grid;
    place-items:center;
    width:calc(var(--fs-emo) + 10px);
    height:calc(var(--fs-emo) + 10px);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.08));
  }
  .opt .emoji.txt{
    font-size:calc(var(--fs-emo) - 4px);
    font-weight:800;
    letter-spacing:0;
    filter:none;
    background:rgba(255,255,255,.55);
    border-radius:50%;
  }
  :root[data-theme="arcade"] .opt .emoji.txt{
    background:rgba(255,255,255,.08);
  }

  .opt .t{
    flex:1;
    font-size:var(--fs-opt);
    font-weight:600;
    line-height:1.4;
  }

  .opt.sel{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft), 0 10px 22px rgba(0,0,0,.08);
    transform:translateY(-2px);
  }
  .opt.sel::after{
    content:"✓";
    position:absolute;
    top:8px; right:11px;
    font-size:13px;
    font-weight:800;
    color:var(--accent);
    line-height:1;
  }

  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-top:48px;
  }
  .nav button{
    background:none;
    border:0;
    border-bottom:1px solid var(--ink);
    font:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    padding:8px 0;
    cursor:pointer;
    transition:opacity .14s ease, color .14s ease, border-color .14s ease;
  }
  .nav button:hover{ opacity:.55; }
  .nav button:disabled{
    color:var(--faint);
    border-bottom-color:transparent;
    cursor:default;
    opacity:1;
  }
  #next, #fin{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  .ghost{
    display:block;
    margin:62px auto 0;
    background:none;
    border:0;
    font:inherit;
    font-size:12px;
    letter-spacing:.06em;
    color:var(--faint);
    cursor:pointer;
  }
  .ghost:hover{ color:var(--soft); text-decoration:underline; }

  /* ============================================================
     RESULTADOS — CABECERA
     ============================================================ */

  .res-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    flex-wrap:wrap;
  }
  .bignum{
    font-size:76px;
    font-weight:800;
    letter-spacing:-.05em;
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:var(--accent);
    text-shadow:0 4px 24px var(--accent-soft);
  }
  .bigsub{
    font-size:14px;
    color:var(--soft);
    margin-top:12px;
  }

  /* ---------- Pista ---------- */

  .track{ padding:0 16px; margin-top:26px; }

  .track-inner{
    position:relative;
    height:56px;
  }
  .track-inner::before{
    content:"";
    position:absolute;
    left:-16px; right:-16px; bottom:8px;
    height:12px;
    background-image:var(--track-tex);
    pointer-events:none;
  }

  .track-base{
    position:absolute;
    left:0; right:0; bottom:12px;
    height:3px;
    background:var(--line2);
  }
  .track-fill{
    position:absolute;
    left:0; bottom:12px;
    height:3px;
    background:linear-gradient(90deg, var(--low), var(--mid), var(--ok));
    transition:width 1.1s cubic-bezier(.25,.9,.3,1);
  }

  .runner{
    position:absolute;
    bottom:13px;
    font-size:26px;
    line-height:1;
    user-select:none;
    transform:translateX(-50%) scaleX(-1);
    transition:left 1.1s cubic-bezier(.25,.9,.3,1);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.14));
  }

  .scale{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--faint);
    margin-top:6px;
    font-weight:700;
  }
  .scale span:nth-child(1){ color:var(--low); }
  .scale span:nth-child(2){ color:var(--mid); }
  .scale span:nth-child(3){ color:var(--ok); }

  /* ============================================================
     SOLAPAS
     ============================================================ */

  .tabs{
    margin-top:52px;
    display:flex;
    gap:0;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }

  .tab{
    position:relative;
    flex:none;
    background:none;
    border:0;
    font:inherit;
    font-size:13px;
    font-weight:700;
    color:var(--faint);
    padding:14px 16px;
    cursor:pointer;
    white-space:nowrap;
    transition:color .15s ease;
  }
  .tab:hover{ color:var(--soft); }
  .tab.active{ color:var(--ink); }
  .tab::after{
    content:"";
    position:absolute;
    left:12px; right:12px; bottom:-1px;
    height:3px;
    background:var(--accent);
    transform:scaleX(0);
    transition:transform .2s ease;
  }
  .tab.active::after{ transform:scaleX(1); }

  .tab .count{
    display:inline-block;
    margin-left:7px;
    font-size:11px;
    font-weight:700;
    color:var(--faint);
    font-variant-numeric:tabular-nums;
  }
  .tab.active .count{ color:var(--accent); }

  .tabpane{ animation:fadeUp .25s ease both; }
  .tabpane[hidden]{ display:none; }

  /* ---------- Resumen ---------- */

  .lvl{
    margin-top:38px;
    padding-top:30px;
    border-top:1px solid var(--line);
    position:relative;
  }
  .lvl:first-child{ margin-top:22px; }
  .lvl::before{
    content:"";
    position:absolute;
    top:-2px; left:0;
    width:56px;
    height:3px;
    background:var(--accent);
  }

  .lvlhead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
  }
  .lvlhead h2{
    font-size:16px;
    font-weight:800;
    letter-spacing:-.01em;
    margin:0;
  }
  .lvlpct{
    font-size:24px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
  }
  .lvlpct.p-alto{ color:var(--ok); }
  .lvlpct.p-mid{ color:var(--mid); }
  .lvlpct.p-bajo{ color:var(--low); }

  .verdict{
    font-size:14px;
    color:var(--soft);
    margin:22px 0 26px;
    max-width:56ch;
  }

  .cats{ display:flex; flex-direction:column; }

  .cat{
    display:grid;
    grid-template-columns:1fr 130px 56px;
    align-items:center;
    gap:16px;
    padding:10px 0;
    border-bottom:1px solid var(--line2);
  }
  .catname{ font-size:14px; }
  .minibar{
    display:block;
    height:5px;
    background:var(--line2);
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
  }
  .minibar i{
    position:absolute;
    top:0; left:0; bottom:0;
    display:block;
    transition:width .6s cubic-bezier(.3,.9,.3,1);
  }
  .minibar i.m-alto{ background:var(--ok); }
  .minibar i.m-mid{ background:var(--mid); }
  .minibar i.m-bajo{ background:var(--low); }

  .catpct{
    font-size:12px;
    color:var(--soft);
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-weight:700;
  }
  @media (max-width:600px){
    .cat{ grid-template-columns:1fr 70px 48px; gap:10px; }
    .catname{ font-size:13px; }
  }

  /* ---------- Mapa de progreso ---------- */

  .plan h2{
    font-size:16px;
    font-weight:800;
    letter-spacing:-.01em;
    margin:32px 0 8px;
  }
  .plan h2:first-child{ margin-top:22px; }
  .plan .sub{
    font-size:14px;
    color:var(--soft);
    margin:0 0 30px;
    max-width:58ch;
  }

  .group{ margin-bottom:30px; }
  .group h3{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-weight:800;
    margin:0 0 10px;
    padding-left:11px;
    position:relative;
  }
  .group h3::before{
    content:"";
    position:absolute;
    left:0; top:3px; bottom:3px;
    width:4px;
    border-radius:var(--radius);
  }
  .group.g-fort h3{ color:var(--ok); }
  .group.g-fort h3::before{ background:var(--ok); }
  .group.g-proc h3{ color:var(--mid); }
  .group.g-proc h3::before{ background:var(--mid); }
  .group.g-deb  h3{ color:var(--low); }
  .group.g-deb  h3::before{ background:var(--low); }

  .item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:18px;
    padding:9px 0;

}

function aplicarTema(id){
  TEMA_ACTUAL = id;
  document.documentElement.setAttribute('data-theme', id);
  guardarLS(LS_THEME, id);
  marcarTemaActivo(id);
}

function aplicarSize(id){
  document.documentElement.setAttribute('data-size', id);
  guardarLS(LS_SIZE, id);
  marcarSizeActivo(id);
}

/* ============================================================
   PANEL DE AJUSTES
   ============================================================ */

const gear     = document.getElementById('gear');
const panel    = document.getElementById('panel');
const swatches = document.getElementById('swatches');
const sizesBox = document.getElementById('sizes');

swatches.innerHTML = THEMES.map(t => `
  <button class="swatch" data-id="${t.id}">
    <span class="dots">
      ${t.colores.map(c => `<i style="background:${c}"></i>`).join('')}
    </span>
    <span class="sw-text">
      <b>${t.nombre}</b>
      <small>${t.sub}</small>
    </span>
  </button>
`).join('');

swatches.querySelectorAll('.swatch').forEach(b => {
  b.onclick = () => aplicarTema(b.dataset.id);
});

sizesBox.querySelectorAll('button').forEach(b => {
  b.onclick = () => aplicarSize(b.dataset.size);
});

function marcarTemaActivo(id){
  swatches.querySelectorAll('.swatch').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
}
function marcarSizeActivo(id){
  sizesBox.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.size === id);
  });
}

function cerrarPanel(){
  panel.hidden = true;
  gear.classList.remove('on');
  gear.setAttribute('aria-expanded', 'false');
}

gear.onclick = e => {
  e.stopPropagation();
  const abierto = !panel.hidden;
  panel.hidden = abierto;
  gear.classList.toggle('on', !abierto);
  gear.setAttribute('aria-expanded', String(!abierto));
};

document.addEventListener('click', e => {
  if(panel.hidden) return;
  if(panel.contains(e.target) || gear.contains(e.target)) return;
  cerrarPanel();
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !panel.hidden) cerrarPanel();
});

/* ============================================================
   MOTOR
   ============================================================ */

const app = document.getElementById('app');
const TOTAL = DATA.reduce((a, n) => a + n.preguntas.length, 0);

let S = null;
let pantalla = 'inicio';

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

/* ---------------- Pantalla inicial ---------------- */

function renderInicio() {
  pantalla = 'inicio';
  S = null;

  app.innerHTML = `
    <div class="wrap">
      <p class="eyebrow">Test diagnóstico</p>
      <h1>Evaluación inicial</h1>
      <p class="lead">
        ${TOTAL} preguntas organizadas en tres niveles.
        Sin cronómetro y sin corrección a la vista:
        la idea es ver <em>cómo</em> piensas, no qué tan rápido vas.
      </p>

      <div class="menu">
        <button class="btn" data-modo="all">
          <span class="t">Test completo</span>
          <span class="s">Los tres niveles · ${TOTAL} preguntas</span>
        </button>
        ${DATA.map((n, i) => `
          <button class="btn" data-modo="${i}">
            <span class="t">${esc(n.nombre)} · ${esc(n.sub)}</span>
            <span class="s">${n.preguntas.length} preguntas</span>
          </button>`).join('')}
      </div>

      <p class="foot">Al terminar se genera un diagnóstico por nivel y por tema.</p>
    </div>`;

  app.querySelectorAll('.btn').forEach(b => {
    b.onclick = () => {
      const m = b.dataset.modo;
      start(m === 'all' ? 'all' : Number(m));
    };
  });
}

/* ---------------- Iniciar ---------------- */

function start(modo) {
  const cola = [];
  DATA.forEach((n, ni) => {
    if (modo !== 'all' && ni !== modo) return;
    n.preguntas.forEach((p, pi) => cola.push({ ni, pi }));
  });

  S = {
    cola,
    i: 0,
    resp: new Array(cola.length).fill(null),
    modo
  };

  renderTest();
}

/* ---------------- Pregunta ---------------- */

function renderTest() {
  pantalla = 'test';

  const { cola, i, resp } = S;
  const item  = cola[i];
  const nivel = DATA[item.ni];
  const p     = nivel.preguntas[item.pi];
  const total = cola.length;
  const pct   = ((i + 1) / total) * 100;

  const tema = temaActual();
  const emojis = tema.emojis;
  const clase = tema.esTexto ? 'emoji txt' : 'emoji';

  app.innerHTML = `
    <div class="wrap">
      <div class="meta">
        <span class="pill">${esc(nivel.nombre)} · ${esc(nivel.sub)}</span>
        <span>${i + 1} / ${total}</span>
      </div>

      <div class="bar"><i style="width:${pct}%"></i></div>

      <div class="q">${esc(p.q)}</div>

      <div class="opts">
        ${p.ops.map((o, k) => `
          <button class="opt${resp[i] === k ? ' sel' : ''}" data-k="${k}">
            <span class="${clase}">${emojis[k]}</span>
            <span class="t">${esc(o)}</span>
          </button>`).join('')}
      </div>

      <div class="nav">
        <button id="prev" ${i === 0 ? 'disabled' : ''}>← Anterior</button>
        ${i === total - 1
          ? '<button id="fin">Ver resultados →</button>'
          : '<button id="next">Siguiente →</button>'}
      </div>

      <button class="ghost" id="abort">Terminar el test ahora</button>
    </div>`;

  app.querySelectorAll('.opt').forEach(b => {
    b.onclick = () => {
      S.resp[S.i] = Number(b.dataset.k);
      renderTest();
    };
  });

  const prev = app.querySelector('#prev');
  if (prev) prev.onclick = () => { S.i--; renderTest(); };

  const next = app.querySelector('#next');
  if (next) next.onclick = () => { S.i++; renderTest(); };

  const fin = app.querySelector('#fin');
  if (fin) fin.onclick = renderResultados;

  app.querySelector('#abort').onclick = renderResultados;

  window.scrollTo(0, 0);
}

/* ---------------- Atajos ---------------- */

document.addEventListener('keydown', e => {
  if (pantalla !== 'test' || !S) return;

  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    const opts = document.querySelectorAll('.opt');
    if (opts[n - 1]) {
      S.resp[S.i] = n - 1;
      renderTest();
    }
    return;
  }
  if (e.key === 'ArrowRight' && S.i < S.cola.length - 1) { S.i++; renderTest(); }
  if (e.key === 'ArrowLeft'  && S.i > 0)                 { S.i--; renderTest(); }
});

/* ---------------- Cálculo ---------------- */

function calcular() {
  const niveles = DATA.map(n => ({
    nombre: n.nombre,
    sub: n.sub,
    total: 0,
    ok: 0,
    cats: {}
  }));

  S.cola.forEach((item, i) => {
    const p = DATA[item.ni].preguntas[item.pi];
    const L = niveles[item.ni];

    L.total++;
    const bien = S.resp[i] === p.ok;
    if (bien) L.ok++;

    if (!L.cats[p.cat]) L.cats[p.cat] = { total: 0, ok: 0 };
    L.cats[p.cat].total++;
    if (bien) L.cats[p.cat].ok++;
  });

  return niveles.filter(L => L.total > 0);
}

function clasePct(pct){
  if (pct >= 75) return 'alto';
  if (pct >= 50) return 'mid';
  return 'bajo';
}

function veredictoNivel(pct) {
  if (pct >= 85) return 'Lo tienes dominado. Puedes moverte a retos más grandes sin problema.';
  if (pct >= 70) return 'Vas muy bien. Solo quedan un par de detalles por afinar.';
  if (pct >= 50) return 'Vas creciendo. Ya reconoces el camino; ahora toca practicarlo más.';
  return 'Apenas comenzando. Es normal: aquí es donde más se aprende.';
}

/* ---------------- Animación ---------------- */

function animarTracks(root){
  const items = root.querySelectorAll('[data-pct]');
  items.forEach((el, idx) => {
    const pct  = el.dataset.pct;
    const fill = el.querySelector('.track-fill');
    const run  = el.querySelector('.runner');

    if(fill) fill.style.width = '0%';
    if(run)  run.style.left   = '0%';

    setTimeout(() => {
      if(fill) fill.style.width = pct + '%';
      if(run)  run.style.left   = pct + '%';
    }, 160 + idx * 160);
  });
}

/* ============================================================
   RESULTADOS
   ============================================================ */

let TAB_ACTIVA = 'resumen';
let FILTRO_REV = 'todas';

function renderResultados() {
  pantalla = 'resultado';
  TAB_ACTIVA = 'resumen';
  FILTRO_REV = 'todas';

  const niveles   = calcular();
  const okTotal   = niveles.reduce((a, L) => a + L.ok, 0);
  const qTotal    = niveles.reduce((a, L) => a + L.total, 0);
  const pctGlobal = Math.round((okTotal / qTotal) * 100);

  /* --- clasificación por tema --- */
  const planas = [];
  niveles.forEach(L => {
    Object.entries(L.cats).forEach(([nombre, c]) => {
      planas.push({
        nivel: L.nombre,
        nombre,
        ok: c.ok,
        total: c.total,
        pct: Math.round((c.ok / c.total) * 100)
      });
    });
  });

  const dominados    = planas.filter(c => c.pct >= 75);
  const construyendo = planas.filter(c => c.pct >= 50 && c.pct < 75);
  const comenzando   = planas.filter(c => c.pct < 50);

  /* --- bloques por nivel --- */
  const bloquesNivel = niveles.map(L => {
    const pct  = Math.round((L.ok / L.total) * 100);
    const cls  = clasePct(pct);

    const cats = Object.entries(L.cats)
      .map(([nombre, c]) => {
        const cp = Math.round((c.ok / c.total) * 100);
        return { nombre, ok: c.ok, total: c.total, pct: cp, cls: clasePct(cp) };
      })
      .sort((a, b) => a.pct - b.pct);

    return `
      <section class="lvl">
        <div class="lvlhead">
          <h2>${esc(L.nombre)} · ${esc(L.sub)}</h2>
          <span class="lvlpct p-${cls}">${pct}%</span>
        </div>

        <div class="track">
          <div class="track-inner" data-pct="${pct}">
            <div class="track-base"></div>
            <div class="track-fill" style="width:${pct}%"></div>
            <div class="runner" style="left:${pct}%">🏃</div>
          </div>
        </div>
        <div class="scale">
          <span>Comenzando</span><span>Creciendo</span><span>Dominando</span>
        </div>

        <p class="verdict">${veredictoNivel(pct)}</p>

        <div class="cats">
          ${cats.map(c => `
            <div class="cat">
              <span class="catname">${esc(c.nombre)}</span>
              <span class="minibar"><i class="m-${c.cls}" style="width:${c.pct}%"></i></span>
              <span class="catpct">${c.ok}/${c.total}</span>
            </div>`).join('')}
        </div>
      </section>`;
  }).join('');

  /* --- listas --- */
  const lista = (arr, vacio) => {
    if (!arr.length) return `<p class="empty">${vacio}</p>`;
    return arr.map(c => `
      <div class="item">
        <span>${esc(c.nombre)} <span style="color:var(--faint)">· ${esc(c.nivel)}</span></span>
        <span class="tag">${c.ok}/${c.total} · ${c.pct}%</span>
      </div>`).join('');
  };

  /* --- recomendación --- */
  const n1 = niveles.find(L => L.nombre === 'Nivel 1');
  const n2 = niveles.find(L => L.nombre === 'Nivel 2');
  const n3 = niveles.find(L => L.nombre === 'Nivel 3');
  const p  = L => L ? Math.round((L.ok / L.total) * 100) : null;

  let recomendacion;
  if (n1 && p(n1) < 60) {
    recomendacion = 'Antes de avanzar, vale la pena dedicar unas sesiones a afianzar la base del Nivel 1. Con los fundamentos firmes, todo lo demás se hace mucho más llevadero.';
  } else if (n2 && p(n2) < 60) {
    recomendacion = 'Lo básico va bien encaminado. El siguiente tramo es el Nivel 2: ahí es donde más se nota el trabajo, y donde conviene concentrar las sesiones.';
  } else if (n3 && p(n3) < 60) {
    recomendacion = 'Los dos primeros niveles van sólidos. El trabajo fino está en lo avanzado, donde toca combinar varios conceptos a la vez.';
  } else {
    recomendacion = 'Vas muy bien en los tres niveles. El siguiente paso son problemas más largos, donde haya que justificar cada decisión.';
  }

  /* --- render --- */
  app.innerHTML = `
    <div class="wrap">
      <p class="eyebrow">Diagnóstico</p>
      <h1>Tu resultado</h1>

      <div class="res-head">
        <div>
          <div class="bignum">${pctGlobal}%</div>
          <div class="bigsub">${okTotal} de ${qTotal} respuestas correctas</div>
        </div>
      </div>

      <div class="track">
        <div class="track-inner" data-pct="${pctGlobal}">
          <div class="track-base"></div>
          <div class="track-fill" style="width:${pctGlobal}%"></div>
          <div class="runner" style="left:${pctGlobal}%">🏃</div>
        </div>
      </div>
      <div class="scale">
        <span>Comenzando</span><span>Creciendo</span><span>Dominando</span>
      </div>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="resumen">Resumen</button>
        <button class="tab" data-tab="mapa">Mapa de progreso</button>
        <button class="tab" data-tab="revision">Revisión<span class="count" id="cntRev">${qTotal}</span></button>
      </nav>

      <!-- ============ SOLAPA: RESUMEN ============ -->
      <section class="tabpane" data-pane="resumen" data-print-title="Resumen por nivel">
        ${bloquesNivel}
      </section>

      <!-- ============ SOLAPA: MAPA DE PROGRESO ============ -->
      <section class="tabpane" data-pane="mapa" data-print-title="Mapa de progreso" hidden>
        <div class="plan">
          <h2>Tu mapa de progreso</h2>
          <p class="sub">${recomendacion}</p>

          <div class="group g-fort">
            <h3>Lo que ya dominas</h3>
            ${lista(dominados, 'Aún no hay temas con dominio completo. Es normal al empezar.')}
          </div>

          <div class="group g-proc">
            <h3>Lo que estás construyendo</h3>
            ${lista(construyendo, 'Ningún tema quedó a medio camino.')}
          </div>

          <div class="group g-deb">
            <h3>Hasta ahora, comenzando</h3>
            ${lista(comenzando, 'Ningún tema apenas comenzando. ¡Buen inicio!')}
          </div>
        </div>
      </section>

      <!-- ============ SOLAPA: REVISIÓN ============ -->
      <section class="tabpane" data-pane="revision" data-print-title="Revisión pregunta a pregunta" hidden>
        ${htmlRevision()}
      </section>

      <div class="actions">
        <button id="print">Imprimir / guardar PDF</button>
        <button id="again">Volver a empezar</button>
      </div>
    </div>`;

  /* --- eventos solapas --- */
  const tabs = app.querySelectorAll('.tab');
  tabs.forEach(t => {
    t.onclick = () => activarTab(t.dataset.tab);
  });

  /* --- eventos filtros de revisión --- */
  enlazarFiltros();

  app.querySelector('#print').onclick = () => window.print();
  app.querySelector('#again').onclick = renderInicio;

  animarTracks(app);
  window.scrollTo(0, 0);
}

/* ---------------- Solapas ---------------- */

function activarTab(nombre){
  TAB_ACTIVA = nombre;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === nombre);
  });
  document.querySelectorAll('.tabpane').forEach(p => {
    p.hidden = p.dataset.pane !== nombre;
  });
  if(nombre === 'resumen') animarTracks(app);
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ============================================================
   REVISIÓN CUANTITATIVA
   ============================================================ */

function estadoPregunta(i){
  const item = S.cola[i];
  const p = DATA[item.ni].preguntas[item.pi];
  const r = S.resp[i];
  if(r === null) return 'bl';
  return r === p.ok ? 'ok' : 'no';
}

function htmlRevision(){
  let ok = 0, no = 0, bl = 0;
  S.cola.forEach((_, i) => {
    const e = estadoPregunta(i);
    if(e === 'ok') ok++;
    else if(e === 'no') no++;
    else bl++;
  });

  const items = S.cola.map((item, i) => htmlRevItem(i, item)).join('');

  return `
    <div class="rev-head">
      <div class="rev-stats">
        <span class="st-ok"><b>${ok}</b> correctas</span>
        <span class="st-no"><b>${no}</b> incorrectas</span>
        <span class="st-bl"><b>${bl}</b> sin responder</span>
      </div>
      <div class="filters" id="filtros">
        <button data-f="todas" class="active">Todas</button>
        <button data-f="no">Solo incorrectas</button>
        <button data-f="bl">Sin responder</button>
      </div>
    </div>
    <div class="rev" id="rev">${items}</div>
    <p class="rev-empty" id="revEmpty" hidden>No hay preguntas que coincidan con este filtro.</p>
  `;
}

function htmlRevItem(i, item){
  const p     = DATA[item.ni].preguntas[item.pi];
  const r     = S.resp[i];
  const nivel = DATA[item.ni];
  const estado = estadoPregunta(i);

  const letras = ['A','B','C','D'];

  const opts = p.ops.map((o, k) => {
    const esCorrecta   = k === p.ok;
    const esEstudiante = k === r;

    let clase = '';
    let badge = '';

    if(esCorrecta && esEstudiante){
      clase = 'correct';
      badge = '<span class="badge mixta">correcta · tu respuesta</span>';
    } else if(esCorrecta){
      clase = 'correct';
      badge = '<span class="badge">correcta</span>';
    } else if(esEstudiante){
      clase = 'wrong';
      badge = '<span class="badge">tu respuesta</span>';
    }

    return `
      <div class="rev-opt ${clase}">
        <span class="rk">${letras[k]}</span>
        <span class="rt">${esc(o)}</span>
        ${badge}
      </div>`;
  }).join('');

  const nota = r === null
    ? '<p class="rev-note">Esta pregunta quedó sin responder.</p>'
    : (estado === 'no'
        ? '<p class="rev-note">La respuesta marcada no coincide con la correcta.</p>'
        : '');

  return `
    <article class="rev-item ${estado}" data-estado="${estado}">
      <div class="rev-top">
        <span class="rev-num">${i + 1}</span>
        <span class="rev-nivel">${esc(nivel.nombre)} · ${esc(nivel.sub)}</span>
        <span class="rev-cat">${esc(p.cat)}</span>
      </div>
      <p class="rev-q">${esc(p.q)}</p>
      <div class="rev-opts">${opts}</div>
      ${nota}
    </article>`;
}

/* ---------------- Filtros de la revisión ---------------- */

function enlazarFiltros(){
  const filtros = document.getElementById('filtros');
  if(!filtros) return;

  filtros.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      FILTRO_REV = b.dataset.f;
      filtros.querySelectorAll('button').forEach(x => {
        x.classList.toggle('active', x.dataset.f === FILTRO_REV);
      });
      aplicarFiltroRev();
    };
  });
}

function aplicarFiltroRev(){
  const cont = document.getElementById('rev');
  const vacio = document.getElementById('revEmpty');
  if(!cont) return;

  let visibles = 0;
  cont.querySelectorAll('.rev-item').forEach(el => {
    const e = el.dataset.estado;
    const mostrar =
      FILTRO_REV === 'todas' ? true :
      FILTRO_REV === 'no'    ? (e === 'no') :
      FILTRO_REV === 'bl'    ? (e === 'bl') : true;

    el.hidden = !mostrar;
    if(mostrar) visibles++;
  });

  if(vacio) vacio.hidden = visibles > 0;
}

/* ============================================================
   ARRANQUE
   ============================================================ */

aplicarTema(leerLS(LS_THEME, THEMES.map(t => t.id), 'clasico'));
aplicarSize(leerLS(LS_SIZE, ['s','m','l','xl'], 'm'));
renderInicio();
</script>
